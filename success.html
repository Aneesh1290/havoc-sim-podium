<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Status - Havoc Sim Podium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="havoc_logo.png">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #080808;
            color: #fff;
            font-family: "Outfit", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: -30%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(229,184,105,0.12) 0%, transparent 70%);
            pointer-events: none;
        }
        .success-wrap {
            max-width: 600px;
            width: 100%;
            text-align: center;
            animation: fadeUp 0.7s ease both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .check-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #e5b869, #c9952f);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            box-shadow: 0 0 40px rgba(229, 184, 105, 0.3);
        }
        .check-icon.error {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            box-shadow: 0 0 40px rgba(239, 68, 68, 0.3);
        }
        .check-icon svg {
            width: 40px;
            height: 40px;
            stroke: #000;
            stroke-width: 3;
        }
        h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 0.5rem; }
        h1 span { color: #e5b869; }
        h1 span.error-text { color: #ef4444; }
        .subtitle { color: rgba(255,255,255,0.5); font-size: 1rem; margin-bottom: 2.5rem; }
        
        .booking-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 2rem;
            text-align: left;
            margin-bottom: 2rem;
            display: none;
        }
        .booking-card h3 {
            font-size: 0.75rem; font-weight: 700; letter-spacing: 3px;
            color: rgba(255,255,255,0.3); text-transform: uppercase; margin-bottom: 1.5rem;
        }
        .bc-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.75rem 0; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .bc-row:last-child { border-bottom: none; }
        .bc-label { font-size: 0.85rem; color: rgba(255,255,255,0.4); }
        .bc-value { font-size: 0.95rem; font-weight: 600; text-align: right; max-width: 60%; }
        .bc-value.gold { color: #e5b869; }
        .bc-ref { font-size: 0.75rem; font-family: monospace; color: rgba(255,255,255,0.3); word-break: break-all; }
        
        .btn-home {
            display: inline-flex; align-items: center; gap: 0.5rem; padding: 1rem 2rem;
            background: linear-gradient(135deg, #e5b869, #c9952f); color: #000;
            font-family: "Outfit", sans-serif; font-size: 0.9rem; font-weight: 800;
            letter-spacing: 2px; border: none; border-radius: 10px; cursor: pointer;
            text-decoration: none; transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-home:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(229, 184, 105, 0.3); }
        .email-note { margin-top: 1.5rem; font-size: 0.82rem; color: rgba(255,255,255,0.3); display: none; }

        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #e5b869;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 2rem;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="success-wrap">
        
        <div id="loadingState">
            <div class="loader"></div>
            <h1>Verifying <span>Payment...</span></h1>
            <p class="subtitle">Please do not refresh the page.</p>
        </div>

        <div id="resultState" style="display: none;">
            <div class="check-icon" id="statusIcon">
                <!-- Check or X icon inserted by JS -->
            </div>

            <h1 id="statusTitle"></h1>
            <p class="subtitle" id="statusSubtitle"></p>

            <div class="booking-card" id="bookingCard">
                <h3>Booking Details</h3>
                <div class="bc-row"><span class="bc-label">Simulator</span><span class="bc-value" id="s-item">-</span></div>
                <div class="bc-row"><span class="bc-label">Date</span><span class="bc-value" id="s-date">-</span></div>
                <div class="bc-row"><span class="bc-label">Time Slot</span><span class="bc-value" id="s-time">-</span></div>
                <div class="bc-row"><span class="bc-label">Booked For</span><span class="bc-value" id="s-name">-</span></div>
                <div class="bc-row"><span class="bc-label">Amount Paid</span><span class="bc-value gold" id="s-price">-</span></div>
                <div class="bc-row"><span class="bc-label">Order ID</span><span class="bc-value bc-ref" id="s-orderid">-</span></div>
            </div>

            <a href="index.html" class="btn-home">&#8592; BACK TO HOME</a>
            <p class="email-note" id="emailNote">A confirmation will be sent to your email address.</p>
        </div>

    </div>

    <script>
        const BACKEND_URL = "http://localhost:3000";
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order_id');

        const loadingState = document.getElementById('loadingState');
        const resultState = document.getElementById('resultState');
        const statusIcon = document.getElementById('statusIcon');
        const statusTitle = document.getElementById('statusTitle');
        const statusSubtitle = document.getElementById('statusSubtitle');
        const bookingCard = document.getElementById('bookingCard');
        const emailNote = document.getElementById('emailNote');

        const showError = (title, msg) => {
            loadingState.style.display = 'none';
            resultState.style.display = 'block';
            statusIcon.classList.add('error');
            statusIcon.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`;
            statusTitle.innerHTML = `Payment <span class="error-text">${title}</span>`;
            statusSubtitle.innerText = msg;
        };

        const showSuccess = (booking, oId) => {
            loadingState.style.display = 'none';
            resultState.style.display = 'block';
            statusIcon.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
            statusTitle.innerHTML = `Booking <span>Confirmed!</span>`;
            statusSubtitle.innerText = "Get ready to feel the rush. See you at Havoc Sim Podium!";
            
            bookingCard.style.display = 'block';
            emailNote.style.display = 'block';

            const fmt = (id, val) => { const el = document.getElementById(id); if (el) el.innerText = val || '-'; };
            fmt('s-item',   booking.item);
            fmt('s-price',  booking.price);
            fmt('s-name',   booking.name);
            fmt('s-orderid', oId);
            if (booking.date) {
                const d = new Date(booking.date);
                fmt('s-date', d.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }));
            }
            fmt('s-time', booking.time);
        };

        async function verifyPayment() {
            if (!orderId) {
                // If they just navigated directly, check if we have a booked session
                const rawBooking = localStorage.getItem('havoc_booking');
                if (rawBooking) {
                    showSuccess(JSON.parse(rawBooking), JSON.parse(rawBooking).orderId);
                } else {
                    window.location.href = 'index.html';
                }
                return;
            }

            try {
                const res = await fetch(`${BACKEND_URL}/verify-payment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ order_id: orderId })
                });

                const data = await res.json();

                if (data.success && data.status === 'PAID') {
                    // Payment successful!
                    const pendingRaw = localStorage.getItem('havoc_pending_booking');
                    let booking = pendingRaw ? JSON.parse(pendingRaw) : {};
                    booking.orderId = orderId;
                    
                    // Save as final booking and clean up
                    localStorage.setItem('havoc_booking', JSON.stringify(booking));
                    localStorage.removeItem('havoc_pending_booking');
                    localStorage.removeItem('havoc_cart');

                    showSuccess(booking, orderId);
                } else {
                    showError("Failed", `Your payment status is: ${data.status || 'Unknown'}. Please contact support if amount was deducted.`);
                }
            } catch (err) {
                console.error(err);
                showError("Error", "Could not verify payment status. Please contact support.");
            }
        }

        verifyPayment();
    </script>
</body>
</html>
