<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Login - Havoc</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="havoc_logo.png">
    <style>
        body { 
            background: #0a0a0c url('main_background.png') no-repeat center center/cover;
            color: #fff; 
            font-family: 'Outfit', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 12, 0.85); /* Dark overlay */
            backdrop-filter: blur(8px);
            z-index: 0;
        }
        
        .login-box { 
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.03); 
            padding: 3rem 2.5rem; 
            border-radius: 20px; 
            width: 100%; 
            max-width: 420px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.1); 
            backdrop-filter: blur(15px);
            text-align: center;
        }
        
        .login-logo {
            width: 80px;
            margin-bottom: 1rem;
        }
        
        .login-box h2 { 
            margin: 0 0 0.5rem 0; 
            color: #fff; 
            font-weight: 700;
            font-size: 1.8rem;
        }
        .login-box p.subtitle {
            color: var(--accent-gold);
            font-size: 0.95rem;
            margin: 0 0 2rem 0;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
        }
        
        .input-group { margin-bottom: 1.5rem; text-align: left; }
        .input-group label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: #aaa; font-weight: 500; }
        .input-group input { 
            width: 100%; 
            padding: 0.9rem 1rem; 
            background: rgba(0,0,0,0.3); 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 8px; 
            color: #fff; 
            font-family: inherit; 
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .input-group input:focus {
            outline: none;
            border-color: var(--accent-gold);
            background: rgba(0,0,0,0.5);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
        }
        
        .btn-login { 
            width: 100%; 
            padding: 1rem; 
            background: var(--accent-gold); 
            color: #000; 
            font-weight: 700; 
            font-size: 1rem;
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            margin-top: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-login:hover { 
            background: #e5b869; 
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        
        .error-msg { 
            color: #ff4d4d; 
            font-size: 0.85rem; 
            text-align: center; 
            margin-top: 1rem; 
            padding: 0.8rem;
            background: rgba(255, 77, 77, 0.1);
            border-radius: 6px;
            display: none; 
        }
    </style>
</head>
<body>
    <div class="login-box">
        <img src="havoc_logo.png" alt="Havoc Logo" class="login-logo">
        <h2>Welcome Back</h2>
        <p class="subtitle">Instructor Portal</p>
        
        <form id="instructorLoginForm">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="instructor@havoc.com" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login">Login Securely</button>
            <div id="errorMsg" class="error-msg"></div>
        </form>
    </div>
    <script>
        document.getElementById('instructorLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const btn = document.querySelector('.btn-login');
            
            const originalText = btn.textContent;
            btn.textContent = 'Authenticating...';
            btn.disabled = true;
            errorMsg.style.display = 'none';
            
            try {
                const res = await fetch('/api/instructor/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.token) {
                    localStorage.setItem('instructor_token', data.token);
                    window.location.href = '/instructor-dashboard.html';
                } else {
                    errorMsg.textContent = data.error || 'Login failed';
                    errorMsg.style.display = 'block';
                    btn.textContent = originalText;
                    btn.disabled = false;
                }
            } catch (err) {
                errorMsg.textContent = 'Network error. Please try again.';
                errorMsg.style.display = 'block';
                btn.textContent = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
