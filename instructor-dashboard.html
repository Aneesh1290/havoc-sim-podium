<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Dashboard - Havoc</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #0a0a0c; color: #fff; font-family: 'Outfit', sans-serif; margin: 0; padding: 0; }
        .dashboard-header { background: #1a1a1f; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .dashboard-header h1 { margin: 0; font-size: 1.5rem; color: #d4af37; }
        .dashboard-container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        .panel { background: #1a1a1f; padding: 2rem; border-radius: 12px; margin-bottom: 2rem; }
        .panel h2 { margin-top: 0; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 1rem; }
        
        .status-toggle { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
        .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #28a745; }
        input:checked + .slider:before { transform: translateX(26px); }
        
        .day-block { margin-bottom: 1.5rem; padding: 1rem; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; }
        .day-block h3 { margin: 0 0 1rem 0; text-transform: capitalize; color: #d4af37; }
        .slot-grid { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .slot-btn { background: #333; color: #ccc; border: 1px solid #444; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; user-select: none; transition: all 0.2s; }
        .slot-btn.active { background: #d4af37; color: #000; border-color: #d4af37; font-weight: 600; }
        
        .btn-save { background: #d4af37; color: #000; padding: 0.8rem 2rem; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; font-family: inherit; font-size: 1rem; }
        .btn-save:hover { background: #c5a030; }
        .btn-logout { background: transparent; border: 1px solid #d4af37; color: #d4af37; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>
    <header class="dashboard-header">
        <h1>Instructor Portal</h1>
        <div style="display:flex; gap:1rem; align-items:center;">
            <span id="instructorName">Loading...</span>
            <button class="btn-logout" id="logoutBtn">Logout</button>
        </div>
    </header>
    
    <div class="dashboard-container">
        <div class="panel">
            <h2>Availability Status</h2>
            <div class="status-toggle">
                <span style="font-weight: 600; color: #ccc;">Offline</span>
                <label class="switch">
                    <input type="checkbox" id="statusToggle">
                    <span class="slider"></span>
                </label>
                <span style="font-weight: 600; color: #28a745;">Available</span>
            </div>
            <p style="font-size: 0.9rem; color: #888;">If you turn this off, you will not appear on the booking page at all, regardless of your schedule.</p>
        </div>

        <div class="panel">
            <h2>Weekly Schedule</h2>
            <p style="font-size: 0.9rem; color: #888; margin-bottom: 1.5rem;">Select the time slots you are available for each day of the week.</p>
            
            <div id="scheduleContainer">
                <!-- Days will be generated by JS -->
            </div>
            
            <div style="margin-top: 2rem; text-align: right;">
                <button class="btn-save" id="saveScheduleBtn">Save Changes</button>
            </div>
        </div>
    </div>

    <script src="instructor-dashboard.js"></script>
</body>
</html>
