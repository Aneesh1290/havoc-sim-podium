<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Tickets - Havoc Sim Podium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="book.css">
    <link rel="icon" type="image/png" href="havoc_logo.png">
</head>
<body class="booking-page">
    <header class="navbar">
        <div class="nav-container">
            <a href="/" class="logo">
                <img src="havoc_logo.png" alt="Havoc Logo" class="logo-icon">
                <div class="logo-text">
                    <div class="logo-main">HAVOC</div>
                    <div class="logo-sub">SIM PODIUM</div>
                    <div class="logo-unit-text" style="margin-top: 25px; display: block;">A Unit of Havoc Hobby Center Pvt. Ltd</div>
                </div>
            </a>
            
            <nav class="nav-links">
                <a href="/">HOME</a>
                <a href="index.html#simulators">SIMULATORS</a>
                <a href="index.html#contact">CONTACT</a>
            </nav>

            <button class="hamburger-menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main class="book-main">
        <!-- View 1: Month Selector -->
        <section id="monthView" class="book-view active">
            <div class="month-header">
                <h1 class="book-title">CHOOSE YOUR <span class="accent-text">MONTH</span></h1>
            </div>
            <div class="month-selector" id="dynamicMonthSelector">
                <!-- Months will be dynamically injected here by JS -->
            </div>
        </section>

        <!-- View 2: Product Grid -->
        <section id="productView" class="book-view">
            <div class="product-header">
                <div class="breadcrumbs">
                    <a href="/">Home</a> &gt; <span id="currentMonthText">September 2026</span>
                </div>

            </div>
            
            <div class="product-layout">
                <!-- Sidebar Filters -->
                <aside class="product-sidebar">
                    <h3>Browse by</h3>
                    <ul class="filter-list" id="dynamicMonthSidebar">
                        <!-- Sidebar months dynamically injected here by JS -->
                    </ul>
                    <h3 style="margin-top: 2rem;">Category</h3>
                    <ul class="filter-list" id="dynamicCategorySidebar">
                        <li class="active" data-category="all">All Simulators</li>
                    </ul>

                </aside>

                <!-- Product Grid -->
                <div class="product-grid" id="publicProductGrid">
                    <!-- Products will be injected here dynamically -->
                </div>
            </div>
        </section>
    </main>

    <!-- Date & Slot Picker Modal -->
    <div id="slotModal" class="slot-modal-overlay">
        <div class="slot-modal">
            <div class="slot-modal-header">
                <div class="slot-modal-product">
                    <img id="modalProductImg" src="" alt="" class="slot-modal-img">
                    <div>
                        <h3 id="modalProductName">Select Simulator</h3>
                        <span id="modalProductPrice" class="slot-modal-price"></span>
                    </div>
                </div>
                <button class="slot-modal-close" id="slotModalClose">&times;</button>
            </div>

            <div class="slot-modal-body">
                <div class="slot-section">
                    <h4>Select Date <span class="slot-required">*</span></h4>
                    <div class="date-pills" id="datePills"></div>
                </div>

                <div class="slot-section">
                    <h4>Select Time Slot <span class="slot-required">*</span></h4>
                    <div class="time-pills" id="timePills"></div>
                </div>
            </div>

            <div class="slot-modal-footer">
                <div class="slot-selection-summary" id="slotSummary">Select a date and time slot to continue</div>
                <button class="btn-add-confirm" id="confirmAddToCart" disabled>Add to Cart</button>
            </div>
        </div>
    </div>

    <!-- Slide-out Cart -->
    <div id="cartDrawer" class="cart-drawer">
        <div class="cart-header">
            <h2>Cart (<span id="cartCount">1</span> item)</h2>
            <button class="close-cart">&times;</button>
        </div>
        <div class="cart-body" id="cartItemsContainer">
            <!-- Dynamic cart items will be injected here -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Estimated total</span>
                <span class="total-amount" id="cartTotal">₹500.00</span>
            </div>
            <button class="btn btn-primary btn-full checkout-btn">CHECKOUT</button>
        </div>
    </div>

    <script src="book.js"></script>
</body>
</html>
