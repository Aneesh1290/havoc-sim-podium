<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Havoc Sim Podium</title>
    <meta name="description" content="Complete your booking at Havoc Sim Podium.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="checkout.css">
    <link rel="icon" type="image/png" href="havoc_logo.png">
</head>
<body class="checkout-page">

    <!-- Top Bar -->
    <div class="co-topbar">
        <a href="/" class="co-logo">
            <img src="havoc_logo.png" alt="Havoc Logo" class="logo-icon">
            <div class="logo-text">
                <div class="logo-main">HAVOC</div>
                <div class="logo-sub">SIM PODIUM</div>
            </div>
        </a>
        <span class="co-title">CHECKOUT</span>
        <a href="/book" class="co-back">&#8592; Continue Browsing</a>
    </div>

    <main class="co-main">
        <!-- LEFT: Customer Details -->
        <div class="co-left">
            <section class="co-section">
                <h2>Your Details</h2>
                <div class="co-form-grid">
                    <div class="co-field">
                        <label for="co-name">Full Name</label>
                        <input type="text" id="co-name" placeholder="e.g. John Doe" required>
                    </div>
                    <div class="co-field">
                        <label for="co-email">Email Address</label>
                        <input type="email" id="co-email" placeholder="e.g. john@example.com" required>
                    </div>
                    <div class="co-field">
                        <label for="co-phone">Phone Number</label>
                        <input type="tel" id="co-phone" placeholder="e.g. 98765 43210" required>
                    </div>

                </div>
            </section>

            <section class="co-section">
                <h2>Payment</h2>
                <div class="payment-option" data-method="cashfree" style="display: none;">
                    <div class="payment-radio"></div>
                    <img src="https://www.cashfree.com/favicon.ico" alt="Cashfree" class="payment-icon" style="width:28px;height:28px;object-fit:contain;">
                    <div>
                        <strong>Cashfree</strong>
                        <p>Pay securely via UPI, Card, Net Banking or Wallets</p>
                    </div>
                </div>

                <div class="payment-option selected" data-method="cod" style="margin-top: 1rem;">
                    <div class="payment-radio"></div>
                    <svg viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="payment-icon" style="width:28px;height:28px;"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2"></circle><path d="M6 12h.01M18 12h.01"></path></svg>
                    <div>
                        <strong>Pay at Desk</strong>
                        <p>Book now and pay with cash/card when you arrive</p>
                    </div>
                </div>
            </section>

            <button class="btn-pay" id="payNowBtn">
                <span id="payBtnLabel">PAY NOW</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
        </div>

        <!-- RIGHT: Order Summary -->
        <div class="co-right">
            <div class="co-summary-card">
                <h2>Order Summary</h2>
                <div id="co-items-container">
                    <!-- Dynamic cart items will be injected here by checkout.js -->
                </div>

                <div class="summary-divider"></div>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="co-subtotal">-</span>
                </div>
                <div class="summary-row">
                    <span>Booking Fee</span>
                    <span class="summary-free">Free</span>
                </div>

                <div class="co-discount-section">
                    <div class="discount-input-group">
                        <input type="text" id="co-discount-code" placeholder="Discount code">
                        <button id="apply-discount-btn" class="btn-apply">Apply</button>
                    </div>
                    <div id="discount-message" class="discount-message"></div>
                </div>
                
                <div class="summary-row discount-row" id="discount-row" style="display: none;">
                    <span>Discount</span>
                    <span id="co-discount-amount" class="summary-discount">-₹0.00</span>
                </div>
                <div class="summary-row" id="gst-row">
                    <span>GST (18%)</span>
                    <span id="co-gst">-₹0.00</span>
                </div>

                <div class="summary-divider"></div>
                <div class="summary-row summary-total">
                    <span>Total</span>
                    <span id="co-total">-</span>
                </div>

                <div class="secure-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                    <span>Secured by Cashfree</span>
                </div>
            </div>
        </div>
    </main>

    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <script src="checkout.js"></script>
</body>
</html>
